name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDKs
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          (brew install ldid >/dev/null 2>&1 || true)

      - name: Build app and tunnel extension
        run: |
          make clean all -j4 2>&1 | tail -40
          echo "--- extension ---"
          ( cd tunnel && make clean all -j4 2>&1 | tail -20 ) || true
          echo "--- artifacts ---"
          find . -maxdepth 6 -name "*.app" | head -10
          find . -maxdepth 6 -name "*.appex" | head -10

      - name: Assemble Payload IPA
        run: |
          APP=$(find . -maxdepth 6 -type d -name "LyInternal.app" | head -1)
          APPEX=$(find . -maxdepth 6 -type d -name "LyTunnel.appex" | head -1)
          echo "APP=$APP"
          echo "APPEX=$APPEX"
          test -n "$APP"
          rm -rf Payload LyInternal.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p Payload/LyInternal.app/PlugIns
          if [ -n "$APPEX" ]; then cp -R "$APPEX" Payload/LyInternal.app/PlugIns/; fi
          if [ -f Resources/ly_pub.pem ]; then cp Resources/ly_pub.pem Payload/LyInternal.app/; fi
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sly_internal.entitlements "Payload/LyInternal.app/LyInternal" || true
            if [ -f "Payload/LyInternal.app/PlugIns/LyTunnel.appex/LyTunnel" ]; then
              ldid -Sly_internal.entitlements "Payload/LyInternal.app/PlugIns/LyTunnel.appex/LyTunnel" || true
            fi
          fi
          chmod 755 "Payload/LyInternal.app/LyInternal"
          zip -qr LyInternal.ipa Payload
          ls -lh LyInternal.ipa

      - name: Publish IPA as base64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          data = base64.b64encode(open('LyInternal.ipa','rb').read()).decode()
          path = 'dist/ipa.b64'
          url = 'https://api.github.com/repos/%s/contents/%s' % (repo, path)
          hdr = {'Authorization': 'Bearer %s' % token,
                 'Accept': 'application/vnd.github+json',
                 'User-Agent': 'ly-builder',
                 'Content-Type': 'application/json'}
          sha = None
          try:
              req = urllib.request.Request(url, headers=hdr)
              sha = json.load(urllib.request.urlopen(req, timeout=30))['sha']
          except urllib.error.HTTPError:
              sha = None
          payload = {'message': 'publish ipa', 'content': data}
          if sha:
              payload['sha'] = sha
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='PUT', headers=hdr)
          urllib.request.urlopen(req, timeout=120).read()
          print('uploaded dist/ipa.b64 bytes=%d' % len(data))
          PY

name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + iOS SDKs
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          ls "$THEOS/sdks"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          (brew install ldid >/dev/null 2>&1 || true)

      - name: Build app + tunnel extension
        run: |
          set -e
          make clean all -j4 2>&1 | tail -60
          find .theos -name "*.app" -o -name "*.appex" | head -20

      - name: Assemble Payload IPA
        run: |
          set -e
          APP=$(find .theos/obj -type d -name "LyInternal.app" | head -1)
          APPEX=$(find .theos/obj -type d -name "LyTunnel.appex" | head -1)
          echo "APP=$APP"; echo "APPEX=$APPEX"
          rm -rf Payload LyInternal.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p Payload/LyInternal.app/PlugIns
          if [ -n "$APPEX" ]; then cp -R "$APPEX" Payload/LyInternal.app/PlugIns/; fi
          cp Resources/ly_pub.pem Payload/LyInternal.app/ 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sly_internal.entitlements "Payload/LyInternal.app/LyInternal" || true
            [ -n "$APPEX" ] && ldid -Sly_internal.entitlements "Payload/LyInternal.app/PlugIns/LyTunnel.appex/LyTunnel" || true
          fi
          chmod 755 Payload/LyInternal.app/LyInternal
          zip -qr LyInternal.ipa Payload
          ls -lh LyInternal.ipa

      # 把 ipa 以 base64 分片提交回仓库（这样只需 api.github.com 就能取，绕开被墙的 artifact 下载域）
      - name: Publish IPA as base64 chunks
        run: |
          set -e
          SIZE=$(stat -f%z LyInternal.ipa)
          echo "ipa size=$SIZE"
          split -b 900000 LyInternal.ipa /tmp/chunk_
          i=0
          mkdir -p dist
          for f in /tmp/chunk_*; do
            b64=$(base64 -i "$f" | tr -d '\n')
            python3 - "$i" "$b64" <<'PY'
          import base64, json, os, sys, urllib.request
          idx = int(sys.argv[1]); data = sys.argv[2]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          path = f"dist/part-{idx:02d}.b64"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          payload = json.dumps({"message": f"ipa chunk {idx}", "content": data}).encode()
          req = urllib.request.Request(url, data=payload, method="PUT",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                       "User-Agent": "ly-builder", "Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=60).read()
          print("uploaded", path)
          PY
            i=$((i+1))
          done
          echo "$i chunks uploaded"

      - uses: actions/upload-artifact@v4
        with:
          name: LyInternal-ipa
          path: LyInternal.ipa
          if-no-files-found: error
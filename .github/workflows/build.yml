name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ly-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDKs
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid >/dev/null 2>&1 || true
          (which ldid && echo "ldid ok") || echo "ldid missing"

      - name: Build app and tunnel extension
        run: |
          make clean all -j4 2>&1 | tail -30
          ( cd tunnel && make clean all -j4 2>&1 | tail -30 ) || true

      - name: Assemble Payload IPA
        run: |
          set -e
          APP=$(find . -maxdepth 6 -type d -name "LyInternal.app" | head -1)
          APPEX=$(find . -maxdepth 6 -type d -name "LyTunnel.appex" | head -1)
          echo "APP=$APP"
          echo "APPEX=$APPEX"
          test -n "$APP"

          rm -rf Payload LyInternal.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/LyInternal.app/_CodeSignature Payload/LyInternal.app/CodeResources || true

          mkdir -p Payload/LyInternal.app/PlugIns
          if [ -n "$APPEX" ]; then
            cp -R "$APPEX" Payload/LyInternal.app/PlugIns/
          fi
          APPDIR="Payload/LyInternal.app"
          APPEXDIR="$APPDIR/PlugIns/LyTunnel.appex"

          if [ -d "$APPEXDIR" ]; then
            cp Resources/tunnel-Info.plist "$APPEXDIR/Info.plist"
            rm -f "$APPEXDIR/LyInternal" "$APPEXDIR/ly_pub.pem" || true
            rm -rf "$APPEXDIR/_CodeSignature" || true
            echo "--- appex contents ---"
            ls -la "$APPEXDIR"
            echo "--- appex plist ---"
            plutil -p "$APPEXDIR/Info.plist" | egrep "CFBundleExecutable|NSExtensionPrincipalClass|NSExtensionPointIdentifier" || true
          fi

          if [ -f Resources/ly_pub.pem ]; then cp Resources/ly_pub.pem "$APPDIR/"; fi
          chmod 755 "$APPDIR/LyInternal"

          if command -v ldid >/dev/null 2>&1; then
            ldid -Sly_internal.entitlements "$APPDIR/LyInternal" || echo "ldid app failed"
            if [ -d "$APPEXDIR" ]; then
              chmod 755 "$APPEXDIR/LyTunnel"
              ldid -Sly_internal.entitlements "$APPEXDIR/LyTunnel" || echo "ldid appex failed"
            fi
          fi

          echo "=== VERIFY entitlements (app) ==="
          ldid -e "$APPDIR/LyInternal" 2>/dev/null | egrep -A2 "networkextension|platform-application" || echo "(none)"
          if [ -d "$APPEXDIR" ]; then
            echo "=== VERIFY entitlements (appex) ==="
            ldid -e "$APPEXDIR/LyTunnel" 2>/dev/null | egrep -A2 "networkextension|platform-application" || echo "(none)"
          fi

          echo "=== VERIFY binaries ==="
          file "$APPDIR/LyInternal" || true
          if [ -d "$APPEXDIR" ]; then file "$APPEXDIR/LyTunnel" || true; fi

          zip -qr LyInternal.ipa Payload
          ls -lh LyInternal.ipa

      - name: Publish IPA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          raw = open('LyInternal.ipa','rb').read()
          data = base64.b64encode(raw).decode()
          path = 'dist/ipa.b64'
          url = 'https://api.github.com/repos/%s/contents/%s' % (repo, path)
          hdr = {'Authorization': 'Bearer %s' % token,
                 'Accept': 'application/vnd.github+json',
                 'User-Agent': 'ly-builder',
                 'Content-Type': 'application/json'}
          sha = None
          try:
              req = urllib.request.Request(url, headers=hdr)
              sha = json.load(urllib.request.urlopen(req, timeout=30))['sha']
          except Exception:
              sha = None
          p = {'message': 'publish ipa', 'content': data}
          if sha: p['sha'] = sha
          req = urllib.request.Request(url, data=json.dumps(p).encode(), method='PUT', headers=hdr)
          urllib.request.urlopen(req, timeout=180).read()
          print('published ipa bytes=%d' % len(raw))
          PY

name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ly-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDKs
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid >/dev/null 2>&1 || true
          which ldid || echo 'ldid missing'

      - name: Build app and tunnel extension
        run: |
          make clean all -j4 2>&1 | tail -40
          ( cd tunnel && make clean all -j4 2>&1 | tail -20 ) || true

      - name: Assemble unsigned Payload IPA
        run: |
          APP=$(find . -maxdepth 6 -type d -name "LyInternal.app" | head -1)
          APPEX=$(find . -maxdepth 6 -type d -name "LyTunnel.appex" | head -1)
          echo "APP=$APP"; echo "APPEX=$APPEX"
          test -n "$APP"
          rm -rf Payload LyInternal.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p Payload/LyInternal.app/PlugIns
          if [ -n "$APPEX" ]; then cp -R "$APPEX" Payload/LyInternal.app/PlugIns/; fi
          if [ -f Resources/ly_pub.pem ]; then cp Resources/ly_pub.pem Payload/LyInternal.app/; fi
          # 清理可能残留的签名，交给安装工具去签
          rm -rf Payload/LyInternal.app/_CodeSignature Payload/LyInternal.app/CodeResources 2>/dev/null || true
          rm -rf Payload/LyInternal.app/PlugIns/LyTunnel.appex/_CodeSignature 2>/dev/null || true
          chmod 755 "Payload/LyInternal.app/LyInternal"
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sly_internal.entitlements "Payload/LyInternal.app/LyInternal" 2>/dev/null || echo "ldid app failed (ignored)"
            if [ -f "Payload/LyInternal.app/PlugIns/LyTunnel.appex/LyTunnel" ]; then
              ldid -Sly_internal.entitlements "Payload/LyInternal.app/PlugIns/LyTunnel.appex/LyTunnel" 2>/dev/null || echo "ldid appex failed (ignored)"
            fi
          fi
          lipo -info "Payload/LyInternal.app/LyInternal" || true
          zip -qr LyInternal.ipa Payload
          ls -lh LyInternal.ipa

      - name: Publish IPA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          raw = open('LyInternal.ipa','rb').read()
          data = base64.b64encode(raw).decode()
          path = 'dist/ipa.b64'
          url = 'https://api.github.com/repos/%s/contents/%s' % (repo, path)
          hdr = {'Authorization': 'Bearer %s' % token,
                 'Accept': 'application/vnd.github+json',
                 'User-Agent': 'ly-builder',
                 'Content-Type': 'application/json'}
          sha = None
          try:
              req = urllib.request.Request(url, headers=hdr)
              sha = json.load(urllib.request.urlopen(req, timeout=30))['sha']
          except Exception:
              sha = None
          p = {'message': 'publish unsigned ipa', 'content': data}
          if sha: p['sha'] = sha
          req = urllib.request.Request(url, data=json.dumps(p).encode(), method='PUT', headers=hdr)
          urllib.request.urlopen(req, timeout=180).read()
          print('published ipa bytes=%d' % len(raw))
          PY